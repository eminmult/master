server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Файлы, которые меняют содержимое, но не имя — должны no-store, чтобы
    # пользователь не залипал на старом бандле.
    location ~ ^/(main\.dart\.js|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # CanvasKit / шрифты / иконки — статика с хэшем имени.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html gate'ит весь бандл — никогда не кешируем.
    location = /index.html {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # SPA fallback (auto_route на клиенте перехватывает любой путь).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
