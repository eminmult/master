name: itez_mobile
description: itez.app — home services marketplace (BLoC architecture)
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5

  # Routing
  auto_route: ^9.2.2

  # DI
  get_it: ^7.7.0

  # HTTP
  http: ^1.2.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  keyboard_dismisser: ^3.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

  # Firebase / push
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Realtime + WebRTC
  flutter_webrtc: ^0.11.7
  pusher_channels_flutter: ^2.4.0

  # Maps (LiveMapCard, address picker preview)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Master GPS streaming
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.13
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
