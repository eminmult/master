upstream backend {
    server master-api:8000;
}

upstream frontend {
    server master-frontend:3000;
}

upstream mobile {
    server master-mobile-web:80;
}

upstream mobile_dev {
    server master-mobile-dev:8095;
}

upstream mobile_v2 {
    server master-mobile-v2:8095;
}

upstream reverb {
    server master-reverb:8080;
}

upstream sse {
    server master-sse:8086;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # API routes
    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sanctum CSRF
    location /sanctum {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Broadcasting auth (HTTP) — Laravel issues channel-auth signatures for clients.
    location /broadcasting {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Server-Sent Events — long-lived HTTP stream for realtime chat. Works
    # through Cloudflare Flexible SSL without the WSS downgrade problem that
    # blocks `/app/` WebSocket on the main domain.
    location /sse/ {
        proxy_pass http://sse;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        chunked_transfer_encoding off;
    }

    # Reverb WebSocket — Pusher protocol endpoints `/app/<key>` (subscribe)
    # and `/apps/<id>/events` (push from server). Long-lived WS connections
    # require disabled buffering and long read timeouts.
    location /app/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /apps/ {
        proxy_pass http://reverb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File uploads served by backend
    location /storage {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Flutter mobile preview — bundle built with --base-href=/mobile/.
    # The trailing-slash on proxy_pass makes nginx strip the /mobile/ prefix.
    location /mobile/ {
        proxy_pass http://mobile/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Convenience redirect /mobile → /mobile/ so the bundle's relative paths work.
    location = /mobile {
        return 301 /mobile/;
    }

    # Flutter mobile DEV — watch-and-rebuild (incremental build/web).
    # Bundle is built with --base-href=/mobile-dev/ so all relative paths
    # resolve correctly through this proxy. We set no-store so neither
    # Cloudflare nor browsers cache stale dev bundles between rebuilds.
    location /mobile-dev/ {
        proxy_pass http://mobile_dev/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
    }
    location = /mobile-dev {
        return 301 /mobile-dev/;
    }

    # Flutter mobile V2 (BLoC + auto_route + get_it стек). Параллельная
    # сборка, не пересекается с /mobile/ и /mobile-dev/. Bundle собирается
    # с --base-href=/master-mobile-v2/, поэтому относительные пути в
    # index.html (canvaskit.js, main.dart.js, flutter_bootstrap.js, ассеты)
    # резолвятся через этот же location.
    location /master-mobile-v2/ {
        proxy_pass http://mobile_v2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
    }
    location = /master-mobile-v2 {
        return 301 /master-mobile-v2/;
    }

    # Everything else → Nuxt
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
