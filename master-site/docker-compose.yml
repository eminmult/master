services:
  master-db:
    image: postgres:16-alpine
    container_name: master-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: master_db
      POSTGRES_USER: master_user
      POSTGRES_PASSWORD: master_secret_2024
    ports:
      - "5433:5432"
    volumes:
      - master-pgdata:/var/lib/postgresql/data
    networks:
      - master-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master_user -d master_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  master-redis:
    image: redis:7-alpine
    container_name: master-redis
    restart: unless-stopped
    command: redis-server --requirepass 3Un0zIXTxkz3my6D6RwGOfOTLiCOEVBwgEbYExFnlu8
    ports:
      - "6380:6379"
    volumes:
      - master-redis-data:/data
    networks:
      - master-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "3Un0zIXTxkz3my6D6RwGOfOTLiCOEVBwgEbYExFnlu8", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  master-api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: master-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    command: >
      sh -c "composer install --no-interaction &&
             php artisan migrate --force --seed 2>/dev/null;
             php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      master-db:
        condition: service_healthy
      master-redis:
        condition: service_healthy
    networks:
      - master-network

  master-scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: master-scheduler
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    command: >
      sh -c "composer install --no-interaction --no-dev &&
             php artisan schedule:work"
    depends_on:
      master-api:
        condition: service_started
      master-db:
        condition: service_healthy
    networks:
      - master-network

  master-queue:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: master-queue
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    command: >
      sh -c "composer install --no-interaction --no-dev &&
             php artisan queue:work redis --queue=translations,default --sleep=1 --tries=3 --max-time=3600 --timeout=60"
    depends_on:
      master-api:
        condition: service_started
      master-redis:
        condition: service_healthy
    networks:
      - master-network

  master-sse:
    build:
      context: ./sse
      dockerfile: Dockerfile
    container_name: master-sse
    restart: unless-stopped
    environment:
      SSE_PORT: 8086
      REDIS_URL: redis://default:3Un0zIXTxkz3my6D6RwGOfOTLiCOEVBwgEbYExFnlu8@master-redis:6379
      API_INTERNAL_URL: http://master-api:8000/api
    depends_on:
      master-api:
        condition: service_started
      master-redis:
        condition: service_healthy
    networks:
      - master-network

  master-reverb:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: master-reverb
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-vendor:/app/vendor
    command: >
      sh -c "composer install --no-interaction --no-dev &&
             php artisan reverb:start --host=0.0.0.0 --port=8080 --debug"
    depends_on:
      master-api:
        condition: service_started
      master-redis:
        condition: service_healthy
    networks:
      - master-network

  master-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: master-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
    command: >
      sh -c "npm install --legacy-peer-deps &&
             npx nuxt build &&
             node .output/server/index.mjs"
    environment:
      NUXT_PUBLIC_API_BASE: https://itez.app/api
      NUXT_PUBLIC_WS_URL: wss://itez.app
      NUXT_PUBLIC_REVERB_KEY: 88457d12f00a60a993b63821e498ffc7e94661a6c807663b287cb74175956173
      # WS host is a separate DNS-only (grey-cloud) subdomain that bypasses
      # Cloudflare entirely — Flexible SSL on the main domain silently
      # downgrades WSS → HTTP and browsers refuse the mixed-content fallback.
      NUXT_PUBLIC_REVERB_HOST: realtime.itez.app
      NUXT_PUBLIC_REVERB_PORT: "443"
      NUXT_PUBLIC_REVERB_SCHEME: https
      NUXT_PUBLIC_GOOGLE_MAPS_KEY: ""
      API_INTERNAL_URL: http://master-api:8000/api
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      - master-api
    networks:
      - master-network

  master-nginx:
    image: nginx:alpine
    container_name: master-nginx
    restart: unless-stopped
    ports:
      - "8093:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - master-api
      - master-frontend
      - master-reverb
    networks:
      - master-network

volumes:
  master-pgdata:
  master-redis-data:
  backend-vendor:
  frontend-modules:

networks:
  master-network:
    driver: bridge
