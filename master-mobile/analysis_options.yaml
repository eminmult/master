include: package:flutter_lints/flutter.yaml

# Stricter than default flutter_lints — promotes a handful of common
# correctness issues from "info" or "warning" to "error" so CI fails on
# them. Picked the smallest set that has zero false-positive cost; add
# more as the team agrees.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  plugins:
    - custom_lint
  errors:
    # Promote — these are real bugs more often than not.
    invalid_assignment: error
    missing_required_param: error
    missing_return: error
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
    # Quiet — noisy without correctness payoff.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"

linter:
  rules:
    # Style / consistency
    - always_use_package_imports
    - avoid_print
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_final_locals
    - require_trailing_commas
    - sort_pub_dependencies: false

    # Correctness
    - avoid_dynamic_calls
    - avoid_returning_null_for_future
    - cancel_subscriptions
    - close_sinks
    - hash_and_equals
    - prefer_single_quotes
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously
