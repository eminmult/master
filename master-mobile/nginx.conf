server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # main.dart.js / flutter_bootstrap.js change content but keep the same name
    # on every build — must NOT be long-cached during preview.
    location ~ ^/(main\.dart\.js|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js)$ {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # CanvasKit + immutable hashed fonts/icons — long cache OK.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Force no-cache for index.html and the bootstrap script — these gate the
    # whole bundle, so caching them is what makes "user sees old version" bugs.
    # `private` tells Cloudflare not to cache either.
    location = /index.html {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # SPA fallback — routes like /home, /order/123 should serve index.html
    # so go_router can take over on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
}
